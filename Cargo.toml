[package]
name = "vdo-ninja-websocket-logging"
version = "1.0.0"
edition = "2024"
description = "vdo.ninja WebSocket logger"
repository = "https://github.com/trungj2655/vdo-ninja-websocket-logging"
license = "MIT"

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
clap-duration = "0.1.11"
duration-human = "0.1.10"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[profile.slow-release]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
